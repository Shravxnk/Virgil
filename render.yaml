# Render Blueprint — Single-repo deployment for Chakravyuh
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO DEPLOY:
#   1. Push this repo to GitHub/GitLab
#   2. In Render dashboard → New → Blueprint → connect your repo
#   3. After BOTH services deploy, set secrets marked `sync: false`:
#      chakravyuh-api → Environment:
#        OPENAI_API_KEY  → your OpenAI key
#        DATABASE_URL    → your Render PostgreSQL connection string
#      chakravyuh-web → Environment:
#        NEXT_PUBLIC_API_URL → exact URL from chakravyuh-api → Settings → URL
#                              e.g. https://chakravyuh-api-xxxx.onrender.com

services:

  # ── Backend: FastAPI (native Python) ───────────────────────────────────────
  - type: web
    name: chakravyuh-api
    runtime: python
    rootDir: apps/api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: DATABASE_URL
        sync: false
      - key: API_HOST
        value: "0.0.0.0"
      - key: PYTHONUNBUFFERED
        value: "1"

  # ── Frontend: Next.js (native Node) ────────────────────────────────────────
  - type: web
    name: chakravyuh-web
    runtime: node
    rootDir: apps/web
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # IMPORTANT: After chakravyuh-api deploys, copy its URL from
      # Render dashboard → chakravyuh-api → Settings → URL
      # and paste it here: chakravyuh-web → Environment → NEXT_PUBLIC_API_URL
      - key: NEXT_PUBLIC_API_URL
        sync: false
