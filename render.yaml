# Render Blueprint — Single-repo deployment for Chakravyuh
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO DEPLOY:
#   1. Push this repo to GitHub/GitLab
#   2. In Render dashboard → New → Blueprint → connect your repo
#   3. Render will auto-detect this file and create both services
#   4. After first deploy, set OPENAI_API_KEY in the chakravyuh-api
#      service's Environment tab in the Render dashboard
#
# Both services share the same repo but deploy independently.
# The frontend proxies all /api/* calls through Next.js rewrites
# to the API service using Render's internal private network,
# so no CORS config or public API exposure is needed from the browser.

services:

  # ── Backend: FastAPI ────────────────────────────────────────────────────────
  - type: web
    name: chakravyuh-api
    runtime: docker
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false   # ← set this manually in Render dashboard after deploy
      - key: OPENAI_MODEL
        value: gpt-4o

  # ── Frontend: Next.js ───────────────────────────────────────────────────────
  - type: web
    name: chakravyuh-web
    runtime: docker
    dockerfilePath: ./docker/web.Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # Internal URL used by Next.js rewrites (server-side only).
      # "chakravyuh-api" is the service name above — Render resolves it on
      # the private network. Port 10000 is Render's internal default.
      - key: API_INTERNAL_URL
        value: http://chakravyuh-api:10000
      # Leave NEXT_PUBLIC_API_URL empty so the browser uses relative /api/*
      # paths that hit the Next.js rewrite proxy (avoids CORS entirely).
      - key: NEXT_PUBLIC_API_URL
        value: ""

# ── Optional: PostgreSQL (uncomment to enable persistent DB) ─────────────────
# databases:
#   - name: chakravyuh-db
