# Render Blueprint — Single-repo deployment for Chakravyuh
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO DEPLOY:
#   1. Push this repo to GitHub/GitLab
#   2. In Render dashboard → New → Blueprint → connect your repo
#   3. After deploy, set secrets marked `sync: false` in Render dashboard:
#      chakravyuh-api → Environment:
#        OPENAI_API_KEY  → your OpenAI key
#        DATABASE_URL    → full postgres connection string
#      chakravyuh-web → Environment:
#        NEXT_PUBLIC_API_URL → https://<your-api-service-name>.onrender.com
#          (find the exact URL in Render dashboard → chakravyuh-api → Settings → URL)

services:

  # ── Backend: FastAPI (native Python) ───────────────────────────────────────
  - type: web
    name: chakravyuh-api
    runtime: python
    plan: free
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: cd apps/api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: DATABASE_URL
        sync: false
      - key: API_HOST
        value: "0.0.0.0"

  # ── Frontend: Next.js (native Node) ────────────────────────────────────────
  - type: web
    name: chakravyuh-web
    runtime: node
    plan: free
    buildCommand: cd apps/web && npm ci && npm run build
    startCommand: cd apps/web && npm start
    envVars:
      - key: NODE_ENV
        value: production
      # IMPORTANT: Set this in Render dashboard → chakravyuh-web → Environment
      # Value: https://<your-api-url>.onrender.com  (get from chakravyuh-api → Settings)
      - key: NEXT_PUBLIC_API_URL
        sync: false
