# Render Blueprint — Single-repo deployment for Chakravyuh
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO DEPLOY:
#   1. Push this repo to GitHub/GitLab
#   2. In Render dashboard → New → Blueprint → connect your repo
#   3. After deploy, set secrets marked `sync: false` manually in:
#      chakravyuh-api → Environment tab:
#        OPENAI_API_KEY  → your OpenAI key
#        DATABASE_URL    → full postgres connection string from your other Render account
#                          e.g. postgresql://user:pass@dpg-xxxx.render.com/dbname

services:

  # ── Backend: FastAPI ────────────────────────────────────────────────────────
  - type: web
    name: chakravyuh-api
    runtime: docker
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_ENV
        value: production

      # ── OpenAI ──────────────────────────────────────────────────────────────
      # Set in: Render dashboard → chakravyuh-api → Environment
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o

      # ── External PostgreSQL (different Render account) ───────────────────────
      # Set DATABASE_URL in Render dashboard → chakravyuh-api → Environment
      # Get it from: other Render account → your DB service → Connect → External URL
      # Format: postgresql://USER:PASSWORD@HOST/DBNAME
      - key: DATABASE_URL
        sync: false

      # ── Server ──────────────────────────────────────────────────────────────
      - key: API_HOST
        value: "0.0.0.0"

  # ── Frontend: Next.js ───────────────────────────────────────────────────────
  - type: web
    name: chakravyuh-web
    runtime: docker
    dockerfilePath: ./docker/web.Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # Public Render API URL — Next.js server-side rewrites proxy /api/* here
      - key: API_INTERNAL_URL
        value: https://chakravyuh-api.onrender.com
      # Keep empty in production — browser uses relative /api/* paths via rewrite
      - key: NEXT_PUBLIC_API_URL
        value: ""

#       property: password
