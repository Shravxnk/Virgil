[project]
name = "virgil-api"
version = "1.0.0"
description = "Virgil — AI-Powered Fraud Intelligence API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# Prompt strings and long narrative text are exempt from line-length
"app/llm/explainer.py" = ["E501"]
